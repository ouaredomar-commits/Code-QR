<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DzMahall - Liens Officiels</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #ff6a00;
      margin: 0 auto 16px;
      display: block;
      object-fit: cover;
      background: #e2e8f0;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    p {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }
    .btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
    /* Styles spécifiques */
    .btn-store {
      background: #ff6a00;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(255, 106, 0, 0.4);
    }
    .btn-insta {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #ffffff;
    }
    .btn-fb {
      background: #1877f2;
      color: #ffffff;
    }
    .btn-tt {
      background: #000000;
      color: #ffffff;
      border: 1px solid #334155;
    }
    footer {
      margin-top: 32px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="logo.jpg" alt="Logo DzMahall" class="logo">
    <h1>DzMahall</h1>
    <p>Boutique en ligne officielle</p>

    <div class="links">
      <!-- Boutique -->
      <a href="http://dzmahall.store" class="btn btn-store" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h14v12z"/></svg>
        Visiter notre Boutique en ligne
      </a>

      <!-- Instagram -->
      <a href="https://www.instagram.com/dzmahall?stkn=MW0zdHhmYXBneTVpaA==" class="btn btn-insta" target="_blank" rel="noopener">
